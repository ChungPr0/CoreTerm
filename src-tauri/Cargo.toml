[package]
name = "coreterm"
version = "0.5.4"
description = "CoreTerm - Multi-Tab Terminal & SSH Client"
authors = ["ChungPr0"]
edition = "2021"

[lib]
name = "coreterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
portable-pty = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "6"
sha2 = "0.10"
base64 = "0.22"
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "encryption", "rand_core", "std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
keyring = { version = "3", features = ["windows-native"] }
zeroize = { version = "1", features = ["derive"] }
russh = "0.65.1"
russh-sftp = "3.0.1"
tokio-util = { version = "0.7", features = ["rt"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Ime",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Console",
] }

[dev-dependencies]
tempfile = "3"

# Keep crypto key generation fast in debug/dev builds (`RSA-4096` / `bcrypt-pbkdf`).
[profile.dev.package.rsa]
opt-level = 3

[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.bcrypt-pbkdf]
opt-level = 3

[profile.dev.package.blowfish]
opt-level = 3

[profile.dev.package.ssh-key]
opt-level = 3
