<!doctype html>
<html lang="vi" class="dark bg-[#090d16]">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CoreTerm</title>
  </head>
  <body class="bg-[#090d16] text-slate-100 antialiased selection:bg-sky-500/30 selection:text-sky-200 overflow-hidden" style="margin:0;background:#090d16;color:#f1f5f9;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,sans-serif;">
    <div id="root" style="display:flex;flex-direction:column;width:100vw;height:100vh;background:#090d16;">
      <div style="height:40px;flex-shrink:0;display:flex;align-items:center;padding:0 10px;background:#0b101b;border-bottom:1px solid rgba(30,41,59,0.9);gap:8px;box-sizing:border-box;">
        <div style="width:26px;height:26px;border-radius:6px;background:rgba(15,23,42,0.8);border:1px solid rgba(51,65,85,0.6);"></div>
        <div style="position:relative;height:30px;padding:0 14px;border-radius:7px 7px 0 0;background:#0f172a;border:1px solid rgba(51,65,85,0.7);border-bottom:none;display:flex;align-items:center;gap:8px;font-size:12px;color:#e2e8f0;margin-top:9px;box-sizing:border-box;">
          <span style="position:absolute;top:0;left:6px;right:6px;height:2px;border-radius:9999px;background:#38bdf8;"></span>
          <span style="width:7px;height:7px;border-radius:9999px;background:#38bdf8;opacity:0.9;"></span>
          <span>PowerShell</span>
        </div>
      </div>
      <div style="flex:1;background:#090d16;padding:12px 14px;"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
