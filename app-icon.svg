<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="45%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#1f6feb" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.15" />
    </linearGradient>

    <!-- CORE Word Cyan/Blue Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#58a6ff" />
    </linearGradient>

    <!-- TERM Word Pure White/Silver Gradient -->
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Cyan Glow -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Base Canvas Squircle: Clean, minimal, modern Windows 11 / Desktop container -->
  <rect x="56" y="56" width="912" height="912" rx="224" fill="url(#bgGrad)" filter="url(#shadow)" />
  <rect x="56" y="56" width="912" height="912" rx="224" fill="none" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- Pure, Minimalist Typography: CORE (top), TERM (bottom) -->
  <g text-anchor="middle">
    <!-- "CORE" (Top line) -->
    <text x="512" y="470" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Montserrat', Roboto, Arial, sans-serif" font-size="256" font-weight="900" fill="url(#coreGrad)" letter-spacing="16" filter="url(#cyanGlow)">CORE</text>

    <!-- "TERM" (Bottom line) -->
    <text x="512" y="730" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Montserrat', Roboto, Arial, sans-serif" font-size="256" font-weight="900" fill="url(#termGrad)" letter-spacing="16">TERM</text>
  </g>
</svg>