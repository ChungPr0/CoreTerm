name: Build & Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test

      - name: Run Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Rust unit tests
        working-directory: src-tauri
        run: cargo test

      - name: Build application
        run: npm run tauri build

      - name: Collect release artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item "src-tauri/target/release/coreterm.exe" "release-assets/CoreTerm_x64_portable.exe"
          Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" "release-assets/"
          Copy-Item "src-tauri/target/release/bundle/msi/*.msi" "release-assets/"
          $sumLines = Get-ChildItem -Path release-assets -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $sumLines | Set-Content -Path "release-assets/SHA256SUMS.txt" -Encoding utf8
          Get-ChildItem release-assets

      - name: Determine release metadata
        id: meta
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $isTag = "$env:GITHUB_REF".StartsWith("refs/tags/")
          if ($isTag) {
            $tagName = $env:GITHUB_REF_NAME
            $isPre = $tagName.Contains("-")
            "tag=$tagName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "name=CoreTerm $tagName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            if ($isPre) {
              "prerelease=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              "make_latest=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            } else {
              "prerelease=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              "make_latest=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            }
            "rolling=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            $pkg = Get-Content package.json -Raw | ConvertFrom-Json
            $shortSha = $env:GITHUB_SHA.Substring(0, 7)
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -fa nightly -m "Rolling build from main ($shortSha)"
            git push -f origin nightly
            "tag=nightly" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "name=CoreTerm Nightly (main - v$($pkg.version) / $shortSha)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "prerelease=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "make_latest=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "rolling=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Clear stale assets on rolling release
        if: steps.meta.outputs.rolling == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          $assets = @(gh release view nightly --json assets --jq '.assets[].name' 2>$null)
          $viewExit = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if ($viewExit -eq 0 -and $assets.Count -gt 0) {
            foreach ($asset in $assets) {
              if (-not [string]::IsNullOrWhiteSpace($asset)) {
                gh release delete-asset nightly $asset.Trim() --yes
                $global:LASTEXITCODE = 0
              }
            }
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: ${{ steps.meta.outputs.make_latest }}
          generate_release_notes: ${{ steps.meta.outputs.rolling != 'true' }}
          overwrite_files: true
          files: |
            release-assets/*.exe
            release-assets/*.msi
            release-assets/SHA256SUMS.txt
          body: |
            ### Downloads (Windows x64)
            - **Portable**: `CoreTerm_x64_portable.exe` (single-file executable, no installation required)
            - **Installer (NSIS)**: `CoreTerm_*_x64-setup.exe`
            - **Installer (MSI)**: `CoreTerm_*_x64_en-US.msi`
